<title>Edikted Series Explorer</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
/* Layout: a working bench. Findings rail on the left (each finding is a saved view), workspace on the right: the finding's claim, the view tabs, the controls, then the charts and the numbers recomputed from the data. Same identity as the project atlas. */
:root {
  --bg: #fbfafb; --surface: #ffffff; --sunk: #f3f1f4; --line: #e4e0e6; --line-strong: #cfc9d3;
  --fg: #19161b; --fg2: #4f4955; --fg3: #7a7380;
  --accent: #c8166f; --accent-soft: #fbe3ef; --accent-fg: #ffffff;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #0f97ad; --s6: #a3509b; --s7: #6250d6; --s8: #e34948; --s9: #7a8b2e; --s10: #8a6a4f;
  --good: #0ca30c; --warn: #b77a00; --crit: #d03b3b; --band: #c8166f;
  --tip-bg: #19161b; --tip-fg: #f6f3f7;
  --f-display: "Space Grotesk", "Segoe UI", system-ui, sans-serif;
  --f-body: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #141216; --surface: #1c1a1f; --sunk: #232027; --line: #332f38; --line-strong: #47414e;
  --fg: #f1eef3; --fg2: #c4bdc9; --fg3: #958d9b;
  --accent: #ff5ca6; --accent-soft: #3a1a2b; --accent-fg: #1a0b13;
  --s1: #4f95ea; --s2: #f07a48; --s3: #2cc28c; --s4: #f0b42a; --s5: #2ab3c9; --s6: #c472bb; --s7: #9085e9; --s8: #ef6f6f; --s9: #a3b552; --s10: #b48e6e;
  --good: #3cc23c; --warn: #e0a42a; --crit: #ef6a6a; --band: #ff5ca6;
  --tip-bg: #f1eef3; --tip-fg: #19161b; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #141216; --surface: #1c1a1f; --sunk: #232027; --line: #332f38; --line-strong: #47414e;
  --fg: #f1eef3; --fg2: #c4bdc9; --fg3: #958d9b;
  --accent: #ff5ca6; --accent-soft: #3a1a2b; --accent-fg: #1a0b13;
  --s1: #4f95ea; --s2: #f07a48; --s3: #2cc28c; --s4: #f0b42a; --s5: #2ab3c9; --s6: #c472bb; --s7: #9085e9; --s8: #ef6f6f; --s9: #a3b552; --s10: #b48e6e;
  --good: #3cc23c; --warn: #e0a42a; --crit: #ef6a6a; --band: #ff5ca6;
  --tip-bg: #f1eef3; --tip-fg: #19161b; color-scheme: dark; }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font: 14px/1.5 var(--f-body); margin: 0; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--surface); }
h1, h2, h3 { font-family: var(--f-display); line-height: 1.15; text-wrap: balance; margin: 0; }
h1 { font-size: clamp(22px, 3vw, 30px); font-weight: 700; letter-spacing: -0.015em; }
h2 { font-size: 20px; font-weight: 600; letter-spacing: -0.01em; }
h3 { font-size: 14px; font-weight: 600; }
p { margin: 0; max-width: 78ch; }
code, .mono { font-family: var(--f-mono); font-size: 0.86em; }
code { background: var(--sunk); padding: 1px 5px; border-radius: 4px; }
.eyebrow { font: 600 11px/1 var(--f-body); letter-spacing: 0.09em; text-transform: uppercase; color: var(--fg3); }
.muted { color: var(--fg2); }
.small { font-size: 12.5px; }
.num { font-variant-numeric: tabular-nums; }

header.top { background: var(--surface); border-bottom: 1px solid var(--line); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
header.top .in { max-width: 1480px; margin: 0 auto; padding-block: 18px 16px; display: flex; flex-wrap: wrap; gap: 8px 24px; align-items: baseline; justify-content: space-between; }
header.top p { color: var(--fg2); font-size: 13.5px; }

.app { max-width: 1480px; margin: 0 auto; display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 20px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 18px 40px; align-items: start; }
@media (max-width: 960px) { .app { grid-template-columns: minmax(0, 1fr); } .rail { position: static !important; max-height: 300px !important; } }

.rail { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px); max-height: calc(100vh - 24px); overflow: auto; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 10px 8px 12px; display: grid; gap: 2px; align-content: start; }
.rail .sec { padding: 12px 8px 4px; }
.rail button.f { all: unset; cursor: pointer; display: grid; gap: 1px; padding: 7px 8px; border-radius: 7px; color: var(--fg); font-size: 13px; line-height: 1.35; }
.rail button.f small { color: var(--fg3); font-size: 11.5px; font-variant-numeric: tabular-nums; }
.rail button.f:hover { background: var(--sunk); }
.rail button.f:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.rail button.f[aria-current="true"] { background: var(--accent-soft); }
.rail button.f[aria-current="true"] span { color: var(--accent); font-weight: 600; }

main { display: grid; gap: 14px; min-width: 0; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px 18px; display: grid; gap: 10px; min-width: 0; }
.fcard .claim { font-size: 15px; }
.fcard .look { color: var(--fg2); }
.fcard .check { border-left: 3px solid var(--accent); padding: 6px 10px; background: var(--sunk); border-radius: 0 6px 6px 0; font-size: 13px; }
.fcard .check b { font-variant-numeric: tabular-nums; }
.fcard .meta { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; font-size: 12px; color: var(--fg3); }
.fcard.free .claim { color: var(--fg2); }

nav.views { display: flex; flex-wrap: wrap; gap: 4px; }
nav.views button { all: unset; cursor: pointer; font-size: 13px; font-weight: 500; padding: 6px 11px; border-radius: 999px; color: var(--fg2); border: 1px solid var(--line); background: var(--surface); }
nav.views button:hover { color: var(--fg); border-color: var(--line-strong); }
nav.views button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
nav.views button[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }

.controls { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: end; }
.ctl { display: grid; gap: 3px; font-size: 12px; color: var(--fg3); min-width: 0; max-width: 100%; }
.ctl select, .ctl input { width: auto; max-width: 100%; }
.controls, .ctlrow, #vbody, #ws { min-width: 0; max-width: 100%; }
#vbody > *, main > * { min-width: 0; max-width: 100%; }
.ctl > span { font-weight: 500; }
select, input[type="date"], input[type="number"], input[type="text"], input:not([type]) { font: 13px var(--f-body); color: var(--fg); background: var(--bg); border: 1px solid var(--line-strong); border-radius: 7px; padding: 5px 8px; min-height: 32px; max-width: 100%; }
input[type="number"] { width: 90px; }
select:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 0; }
.chk { display: flex; gap: 6px; align-items: center; font-size: 13px; color: var(--fg2); min-height: 32px; }
.chk input { accent-color: var(--accent); width: 15px; height: 15px; margin: 0; }
.ctlrow { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: end; width: 100%; }
.ctlrow.sep { border-top: 1px dashed var(--line); padding-top: 10px; }

.chips { display: flex; flex-wrap: wrap; gap: 5px; width: 100%; min-width: 0; }
.chips button { max-width: 100%; overflow-wrap: anywhere; white-space: normal; }
.chips button { all: unset; cursor: pointer; font-size: 12.5px; padding: 4px 9px; border-radius: 999px; border: 1px solid var(--line); color: var(--fg2); background: var(--bg); display: inline-flex; gap: 6px; align-items: center; }
.chips button i { width: 9px; height: 9px; border-radius: 50%; background: var(--line-strong); display: inline-block; }
.chips button small { color: var(--fg3); font-variant-numeric: tabular-nums; }
.chips button[aria-pressed="true"] { border-color: var(--fg2); color: var(--fg); background: var(--surface); }
.chips button:focus-visible { outline: 2px solid var(--accent); }
.chips .act { border-style: dashed; color: var(--fg3); }

.chart { width: 100%; max-width: 100%; min-height: 380px; }
.chart.short { min-height: 300px; }
.charthead { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: baseline; justify-content: space-between; }
.note { font-size: 12.5px; color: var(--fg3); }
.warnline { font-size: 12.5px; color: var(--warn); }

.tbl { overflow-x: auto; }
table { border-collapse: collapse; font-size: 12.5px; font-variant-numeric: tabular-nums; width: 100%; }
th, td { padding: 5px 8px; border-bottom: 1px solid var(--line); text-align: right; white-space: nowrap; }
th:first-child, td:first-child { text-align: left; }
th { font-weight: 600; color: var(--fg2); background: var(--sunk); position: sticky; top: 0; }
td.l { text-align: left; }
.sw { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; vertical-align: 0; }

.infogrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(140px, 100%), 1fr)); gap: 8px 16px; font-size: 13px; }
.infogrid div { display: grid; gap: 1px; min-width: 0; }
.infogrid span { color: var(--fg3); font-size: 11.5px; }
.infogrid b { font-weight: 500; overflow-wrap: anywhere; }

.loading { padding: 60px 20px; text-align: center; color: var(--fg2); }
@media (prefers-reduced-motion: no-preference) { .rail button.f, nav.views button, .chips button { transition: background-color .12s, color .12s, border-color .12s; } }
</style>

<header class="top"><div class="in">
  <div style="display:grid;gap:4px">
    <div class="eyebrow">Edikted demand forecasting</div>
    <h1>Series Explorer</h1>
  </div>
  <p id="hdr">Every finding from the EDA as a live view of the data, with its number recomputed in your browser. Pick a finding on the left, or open any view and group the series your own way.</p>
</div></header>

<div class="app">
  <aside class="rail" id="rail" aria-label="Findings"></aside>
  <main id="main">
    <div class="card loading" id="loading">Loading the series (about 4.5 MB)…</div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/plotly.js-dist-min@2.35.2/plotly.min.js"></script>
<script>
"use strict";
/* ============================== utilities ============================== */
const $ = s => document.querySelector(s);
const DAY = 864e5, T0 = Date.UTC(2024, 0, 1);
const iso = di => new Date(T0 + di * DAY).toISOString().slice(0, 10);
const dIdx = s => Math.round((Date.parse(s + "T00:00:00Z") - T0) / DAY);
const MON = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
const WK = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];
const fmt = (v, d = 0) => v == null || !isFinite(v) ? "–" : Number(v).toLocaleString("en-US", { minimumFractionDigits: d, maximumFractionDigits: d });
const pct = (v, d = 0) => v == null || !isFinite(v) ? "–" : (v >= 0 ? "+" : "−") + Math.abs(v * 100).toFixed(d) + "%";
const x2 = (v, d = 2) => v == null || !isFinite(v) ? "–" : v.toFixed(d) + "×";
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const sum = a => { let s = 0; for (const v of a) s += v; return s; };
const mean = a => a.length ? sum(a) / a.length : NaN;
function quant(a, p) { const s = a.filter(v => v != null && isFinite(v)).sort((x, y) => x - y); if (!s.length) return NaN; const k = (s.length - 1) * p, f = Math.floor(k); return s[f] + (s[Math.min(f + 1, s.length - 1)] - s[f]) * (k - f); }
const median = a => quant(a, 0.5);
function corr(a, b) { const n = a.length; if (n < 3) return NaN; const ma = mean(a), mb = mean(b); let sab = 0, saa = 0, sbb = 0; for (let i = 0; i < n; i++) { const x = a[i] - ma, y = b[i] - mb; sab += x * y; saa += x * x; sbb += y * y; } return sab / Math.sqrt(saa * sbb); }
function pairCorr(a, b) { const x = [], y = []; for (let i = 0; i < a.length; i++) if (a[i] != null && b[i] != null && isFinite(a[i]) && isFinite(b[i])) { x.push(a[i]); y.push(b[i]); } return corr(x, y); }
function centred(v, k, f = mean) { const h = Math.floor(k / 2), out = new Array(v.length).fill(null); for (let t = 0; t < v.length; t++) { const a = Math.max(0, t - h), b = Math.min(v.length, t + h + 1); const w = []; for (let j = a; j < b; j++) if (v[j] != null) w.push(v[j]); out[t] = w.length ? f(w) : null; } return out; }
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const PAL = () => ["--s1", "--s2", "--s3", "--s4", "--s7", "--s8", "--s5", "--s6", "--s9", "--s10"].map(css);
const col = k => { const p = PAL(); return p[k % p.length]; };
function alpha(c, a) { if (c.startsWith("#") && c.length === 7) { const n = parseInt(c.slice(1), 16); return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`; } return c; }

/* ============================== data ============================== */
let D, I, NI, ND, NW, startD, lastD, MS, weekX, monthX, dayX, Wall, Mall, BT, deepSpans = [], deepThr = 0.585;
const CL = ["ONLINE", "RETAIL", "DROP"];
function prep(data) {
  D = data; I = D.items; NI = I.id.length; ND = D.ndays; NW = D.nweeks;
  startD = I.start.map(s => s ? dIdx(s) : -9999); lastD = I.last.map(s => s ? dIdx(s) : -9999);
  MS = []; for (let m = 0; m <= 30; m++) MS.push(dIdx(`${2024 + Math.floor(m / 12)}-${String(m % 12 + 1).padStart(2, "0")}-01`));
  weekX = Array.from({ length: NW }, (_, w) => iso(7 * w)); monthX = D.months.map(m => m + "-01"); dayX = Array.from({ length: ND }, (_, d) => iso(d));
  Wall = I.id.map((_, i) => D.W.ONLINE[i].map((v, w) => v + D.W.RETAIL[i][w] + D.W.DROP[i][w]));
  Mall = I.id.map((_, i) => D.M.ONLINE[i].map((v, m) => v + D.M.RETAIL[i][m] + D.M.DROP[i][m]));
  I.idx = {}; I.id.forEach((s, i) => I.idx[s] = i);
  // backtest: 4-month totals per (origin, item)
  const b = D.bt, n = b.y.length, key = new Map();
  for (let r = 0; r < n; r++) { const k = b.o[r] * NI + b.i[r]; let e = key.get(k); if (!e) { e = { o: b.o[r], i: b.i[r], y: 0, lgb: 0, nn: 0, nh: 0 }; key.set(k, e); } e.y += b.y[r]; e.lgb += b.lgb[r]; e.nn += b.nn[r]; e.nh++; }
  BT = [...key.values()].filter(e => e.nh === 4);
  buildDeep();
}
function buildDeep() { deepSpans = []; const v = D.site.web_disc; let a = null; for (let d = 0; d <= ND; d++) { const on = d < ND && v[d] != null && v[d] >= deepThr; if (on && a == null) a = d; if (!on && a != null) { deepSpans.push([a, d - 1]); a = null; } } }
const monthOfDay = d => { let m = 0; while (m < 29 && MS[m + 1] <= d) m++; return m; };

/* ============================== state ============================== */
const ATTRS = () => Object.keys(I.attrs);
const S = {
  view: "series", dim: "macro", sel: {}, chan: "all", grain: "week", measure: "units", smooth: 0, style: "line", log: false,
  before: "", after: "", targets: false, ov: { deep: true, events: true, stores: false, live: false, cancelled: false }, range: null, showAll: false,
  season: { years: [2024, 2025], lfl: false, base: "index" },
  life: { K: 18, stat: "median", band: true, from: "2024-02-01" },
  scatter: { a0: "2025-03", a1: "2025-06", b0: "2025-07", b1: "2025-10", minA: 100 },
  drift: { mature: false },
  corr: { tf: "dlog", a: 0, b: 1, L: 12, from: "2024-01-01", to: "2026-06-28" },
  dow: { chan: "all", nodeep: false },
  bt: { mode: "month", h: 1, origin: "all", g: 0, model: "lgb" },
  emb: { type: "Dress", color: "macro" },
  item: { id: "S11233_BLACK", daily: false, model: "both" },
  finding: null
};
S.chans = { share: false };

/* ============================== groups ============================== */
const DIMS = () => [["none", "All items"], ["macro", "Category group"], ["type", "Product type"], ["occ", "Occasion tag (each tag counted)"], ["cohort", "Launch half-year"], ["colornum", "Colour number"],
  ["target", "Target vs other"], ["channel", "Channel class"], ["coll", "Collection"], ["item", "Individual items"], ...ATTRS().map(a => ["attr:" + a, "Tagger: " + a])];
function keyOf(dim, i) {
  if (dim === "none" || dim === "channel") return "All items";
  if (dim === "macro") return I.macro[i];
  if (dim === "type") return I.type[i];
  if (dim === "occ") return I.occ[i].split(";").map(x => x.trim()).filter(Boolean);
  if (dim === "coll") return I.coll[i];
  if (dim === "cohort") { const s = startD[i]; if (s < 0) return "before 2024"; const y = 2024 + Math.floor(monthOfDay(s) / 12); return `${y} ${monthOfDay(s) % 12 < 6 ? "H1" : "H2"}`; }
  if (dim === "colornum") return I.color_num[i] === 1 ? "1st colour" : I.color_num[i] === 2 ? "2nd colour" : "3rd+ colour";
  if (dim === "target") return I.target[i] ? "the 100 targets" : "other items";
  if (dim === "item") return I.id[i];
  if (dim.startsWith("attr:")) return I.attrs[dim.slice(5)][i];
  return "?";
}
function passes(i) {
  if (S.before && !(startD[i] < dIdx(S.before))) return false;
  if (S.after && !(lastD[i] >= dIdx(S.after))) return false;
  if (S.targets && !I.target[i]) return false;
  return true;
}
const filtersOn = () => !!(S.before || S.after || S.targets);
function allGroups(dim) {
  const m = new Map();
  if (dim === "channel") { const idx = []; for (let i = 0; i < NI; i++) if (passes(i)) idx.push(i); return CL.map(c => ({ label: c, idx, chan: c, units: idx.reduce((s, i) => s + sum(D.M[c][i]), 0) })); }
  for (let i = 0; i < NI; i++) { if (!passes(i)) continue; const u = sum(Mall[i]); for (const k of [].concat(keyOf(dim, i))) { let g = m.get(k); if (!g) { g = { label: k, idx: [], units: 0 }; m.set(k, g); } g.idx.push(i); g.units += u; } }
  const ck = l => l === "before 2024" ? "0" : l;
  return [...m.values()].sort((a, b) => dim === "cohort" ? ck(a.label).localeCompare(ck(b.label)) : b.units - a.units);
}
function defaultSel(dim) {
  if (dim === "item") return ["S11233_BLACK", "S14857_BLUE-WASHED", "S15999_BLUE"];
  const g = allGroups(dim); return g.slice(0, dim === "cohort" || dim === "channel" ? g.length : 6).map(x => x.label);
}
function selected() {
  const dim = S.dim; if (!S.sel[dim]) S.sel[dim] = defaultSel(dim);
  if (dim === "item") return S.sel.item.filter(id => id in I.idx).map(id => ({ label: id, idx: [I.idx[id]], units: sum(Mall[I.idx[id]]) }));
  const all = allGroups(dim), by = new Map(all.map(g => [g.label, g]));
  return S.sel[dim].map(l => by.get(l)).filter(Boolean);
}
const allIdx = () => { const a = []; for (let i = 0; i < NI; i++) if (passes(i)) a.push(i); return a; };

/* ============================== aggregation ============================== */
const getW = (i, c) => c === "all" ? Wall[i] : D.W[c][i];
const getM = (i, c) => c === "all" ? Mall[i] : D.M[c][i];
function dayAvailable(gs) { if (S.dim === "none" && !filtersOn()) return true; if (S.dim === "channel" && !filtersOn()) return true; if (S.dim === "item") return gs.every(g => D.D[g.label]); return false; }
function agg(idx, grain, c) {
  if (grain === "week") { const v = new Array(NW).fill(0); for (const i of idx) { const a = getW(i, c); for (let w = 0; w < NW; w++) v[w] += a[w]; } return v; }
  if (grain === "month") { const v = new Array(30).fill(0); for (const i of idx) { const a = getM(i, c); for (let m = 0; m < 30; m++) v[m] += a[m]; } return v; }
  // day
  if (S.dim === "item") { const v = new Array(ND).fill(0); for (const i of idx) { const a = D.D[I.id[i]]; for (let d = 0; d < ND; d++) v[d] += a[d]; } return v; }
  return siteDaily(c);
}
function siteDaily(c) { if (c === "all") return D.site.units.ONLINE.map((v, d) => v + D.site.units.RETAIL[d] + D.site.units.DROP[d]); return D.site.units[c].slice(); }
function liveCount(idx, grain) {
  const n = grain === "week" ? NW : grain === "month" ? 30 : ND, v = new Array(n).fill(0);

const addM = (o, h) => { const y = +o.slice(0, 4), m = +o.slice(5) - 1 + h; return `${y + Math.floor(m / 12)}-${String(m % 12 + 1).padStart(2, "0")}`; };

  if (full || !$("#ws")) {
    $("#main").innerHTML = `<div class="card fcard${f ? "" : " free"}" id="fcard"></div><nav class="views" aria-label="Views">${Object.entries(VIEWS).map(([k, x]) => `<button data-v="${k}" aria-pressed="${k === S.view}">${x.label}</button>`).join("")}</nav>
      <div class="card" id="ws"><div class="controls" id="controls"></div><div id="vbody" style="display:grid;gap:12px;min-width:0"></div></div>`;
    $("#main").querySelectorAll("nav.views button").forEach(b => b.addEventListener("click", () => { S.view = b.dataset.v; render(true); }));
    renderRail();
  }
  $("#fcard").innerHTML = f ? `<div class="eyebrow">${esc(f.sec)}</div><h2>${esc(f.t)}</h2><p class="claim">${esc(f.claim)}</p><p class="look"><b>What to look at.</b> ${esc(f.look)}</p><div class="check" id="fcheck">Computing…</div><div class="meta"><span>Source: ${esc(f.src)}</span><button class="act" id="resetf" style="all:unset;cursor:pointer;color:var(--accent);font-weight:500">Reset this view</button></div>`
    : `<div class="eyebrow">Free exploration</div><h2>Group the series your own way</h2><p class="claim">Pick a view, choose what to group by, and click groups on or off. Filters at the bottom of each view make like-for-like cohorts. Units are non-cancelled order lines by New York date, January 2024 to June 2026.</p>`;
  const rb = $("#resetf"); if (rb) rb.addEventListener("click", () => { applyPreset(f); render(true); });
  $("#main").querySelectorAll("nav.views button").forEach(b => b.setAttribute("aria-pressed", b.dataset.v === S.view));
  $("#controls").innerHTML = v.controls(); wireControls($("#controls"));
  const vb = $("#vbody"); if (vb.dataset.v !== S.view) { vb.innerHTML = v.body(); vb.dataset.v = S.view; }
  try { v.draw(); } catch (e) { console.error(e); vb.insertAdjacentHTML("afterbegin", `<p class="warnline">This view could not be drawn: ${esc(e.message)}</p>`); }
  if (f) { const el = $("#fcheck"), saved = { chan: S.chan, before: S.before, after: S.after, targets: S.targets, dim: S.dim };
    try { Object.assign(S, { chan: "all", before: "", after: "", targets: false, dim: "none" }); el.innerHTML = `<b>Recomputed here:</b> ${f.check()}`; } catch (e) { console.error(e); el.textContent = "Could not recompute: " + e.message; } finally { Object.assign(S, saved); } }
}
function fromHash() {
  const h = location.hash.slice(1), f = F.find(x => x.id === h);
  if (f) applyPreset(f); else if (h === "explore") S.finding = null; else applyPreset(F[0]);
}
fetch("data.json").then(r => { if (!r.ok) throw new Error("data.json returned " + r.status); return r.json(); }).then(data => {
  prep(data);
  document.body.insertAdjacentHTML("beforeend", `<datalist id="itemlist">${I.id.map((id, i) => `<option value="${esc(id)}">${esc(I.name[i])} · ${esc(I.type[i])}</option>`).join("")}</datalist>`);
  fromHash(); render(true);
  window.addEventListener("hashchange", () => { fromHash(); render(true); });
  const mq = matchMedia("(prefers-color-scheme: dark)"); mq.addEventListener && mq.addEventListener("change", () => render(false));
  new MutationObserver(() => render(false)).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
}).catch(e => { $("#loading").innerHTML = `The data file could not be loaded (${esc(e.message)}). Reload the page to try again.`; });
</script>
